name: Daily CRWV Simulation

on:
  schedule:
    - cron: '30 16 * * 1-5'  # 4:30 PM ET every weekday (UTC 16:30)
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run CRWV daily simulation
        run: uv run python scripts/crwv_strategy_monitor.py
        env:
          ROBINHOOD_TOKEN: ${{ secrets.ROBINHOOD_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crwv-artifacts
          path: artifacts/
          retention-days: 30
